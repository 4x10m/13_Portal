# ============================================================================
# Portal stack — AxiiomLab Dashboard (Next.js 16, standalone build).
# Core stack : compose maison, pas de vendor upstream.
#
# Toutes les données persistantes vivent dans ${DATA_ROOT} (runtime.env),
# jamais dans le repo.
# Port 3223 publié — accès via le tailnet / ports directs (pas de reverse-proxy).
# docker.sock (ro) sert à la découverte des conteneurs (/api/discover).
# ============================================================================
name: portal

services:
  dashboard:
    build:
      context: ../../dashboard
      dockerfile: Dockerfile
    container_name: axiiomlab-dashboard
    hostname: axiiomlab-dashboard
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "3223:3000"
    volumes:
      - ${DATA_ROOT:-dashboard/data}/dashboard:/app/data
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      - HOSTNAME=0.0.0.0
      - DATABASE_PATH=/app/data/dashboard.db
      - OPENCODE_DB_PATH=${OPENCODE_DB_PATH:-/opencode/opencode.db}
      - CODEBASE_DIR=${CODEBASE_DIR:-/srv/portal/codebase}
      - CLOUD_MANAGER_SCRIPT=${CLOUD_MANAGER_SCRIPT:-/cloud-manager/cloud_manager.sh}
      - OPENCODE_API_URL=${OPENCODE_API_URL:-http://opencode-dashboard:8121}
      - TAILNET=${TAILNET:-}
      - TAILSCALE_API_KEY=${TAILSCALE_API_KEY:-}
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 128M
