name: CI

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shell:
    name: Shell (syntaxe + shellcheck)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        run: |
          set -e
          if ! command -v shellcheck >/dev/null; then
            sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck >/dev/null
          fi
          fail=0
          while IFS= read -r f; do
            shellcheck -S error -x "$f" || fail=1
          done < <(git ls-files '*.sh')
          exit $fail
      - name: Syntaxe bash
        run: |
          set -e
          fail=0
          while IFS= read -r f; do
            bash -n "$f" || fail=1
          done < <(git ls-files '*.sh')
          exit $fail

  compose:
    name: Stacks (render + docker compose)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rendre et valider toutes les stacks
        run: |
          set -e
          cp runtime.env.example runtime.env
          sudo bash bin/render.sh
          echo "stacks OK"

  secrets:
    name: Gitleaks (fuite de secrets)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
